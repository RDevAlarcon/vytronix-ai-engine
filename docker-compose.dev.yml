services:
  db:
    image: postgres:16-alpine
    container_name: vytronix-ai-engine-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vytronix_ai_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - vytronix_ai_engine_db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vytronix_ai_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vytronix-ai-engine-app-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/vytronix_ai_engine
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-qwen2.5-7b-instruct}
      LM_STUDIO_TEMPERATURE: ${LM_STUDIO_TEMPERATURE:-0.1}
      LM_STUDIO_MAX_TOKENS: ${LM_STUDIO_MAX_TOKENS:-900}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-<model-name>}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-900}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-90000}
      WATCHPACK_POLLING: "true"
      API_KEY_REQUIRED: "false"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vytronix_ai_engine_db_dev_data:
