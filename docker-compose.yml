services:
  db:
    image: postgres:16-alpine
    container_name: vytronix-ai-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vytronix_ai_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ricardo
    ports:
      - "5432:5432"
    volumes:
      - vytronix_ai_engine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vytronix_ai_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vytronix-ai-engine-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:Ricardo@db:5432/vytronix_ai_engine
      LLM_PROVIDER: lmstudio
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234
      LM_STUDIO_MODEL: qwen2.5-7b-instruct
      LM_STUDIO_TEMPERATURE: "0.1"
      LM_STUDIO_MAX_TOKENS: "900"
      LLM_REQUEST_TIMEOUT_MS: "90000"
    ports:
      - "3001:3000"
    command: sh -c "npm run db:migrate && npm run start"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vytronix_ai_engine_db_data:
